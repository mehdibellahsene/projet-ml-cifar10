name: Deploy ML Playground

# Deploiement sur le Mac mini auto-heberge (runner org self-hosted macOS).
# Declenche a chaque push sur `production` ou manuellement.
# L'orchestration reelle est dans playground-cifar-model/infra/deploy/deploy.sh.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-ml-playground
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, recreate, expose
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      DEPLOY_BRANCH: production
      PUBLIC_HOST: machine-learning.bellahsene.org
      PUBLIC_PORT: "8771"
      SRV_BIN: ${{ vars.SRV_BIN || 'srv' }}
      # Dossier projet canonique sur l'hote (cree au premier run).
      ML_PROJECT_DIR: ${{ vars.ML_PROJECT_DIR }}

    steps:
      - name: Identite du runner
        run: |
          echo "host: $(hostname)"
          echo "user: $(whoami)"
          echo "docker: $(docker --version 2>/dev/null || echo missing)"
          echo "srv: $(${SRV_BIN} --help 2>&1 | head -n1 || echo missing)"

      # Clone au premier run, sinon fetch + reset --hard sur origin/production.
      # Le token n'est utilise que pour ces operations git puis l'URL repasse
      # en public (aucun token ne persiste sur le disque).
      - name: Sync + deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PROJECT_DIR="${ML_PROJECT_DIR:-$HOME/srv/apps/ml-model-detection}"
          AUTH_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          PUB_URL="https://github.com/${{ github.repository }}.git"

          if [ ! -d "$PROJECT_DIR/.git" ]; then
            echo "==[ premier run -> clone dans $PROJECT_DIR ]=="
            mkdir -p "$(dirname "$PROJECT_DIR")"
            git clone "$AUTH_URL" "$PROJECT_DIR"
          fi

          cd "$PROJECT_DIR"
          git remote set-url origin "$AUTH_URL"
          git fetch origin "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"
          git remote set-url origin "$PUB_URL"
          echo "HEAD: $(git rev-parse --short HEAD)"

          # Git deja synchronise -> on saute la sync interne du script.
          cd "$PROJECT_DIR/playground-cifar-model"
          SKIP_GIT_SYNC=1 make deploy

      - name: Etat post-deploiement
        if: always()
        run: |
          PROJECT_DIR="${ML_PROJECT_DIR:-$HOME/srv/apps/ml-model-detection}"
          cd "$PROJECT_DIR/playground-cifar-model" && make deploy-status || true
