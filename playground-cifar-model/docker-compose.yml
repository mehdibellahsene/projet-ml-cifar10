services:
  web:
    build: .
    image: ml-model-detection:latest
    container_name: ml-model-detection
    restart: unless-stopped
    environment:
      - PORT=${PUBLIC_PORT:-8771}
      - LB_PATH=/srv/lbdata/leaderboard.json
    ports:
      - "${PUBLIC_PORT:-8771}:${PUBLIC_PORT:-8771}"
    volumes:
      - lb-data:/srv/lbdata
    networks:
      - default
      - bmr-internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PUBLIC_PORT:-8771}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  bmr-internal:
    external: true

volumes:
  lb-data:
